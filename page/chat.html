<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinKB 金融知识库</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --side: #eef1f5; --border: #dde2e8; --text: #1f2933; --muted: #6b7785;
    --accent: #1f6feb; --accent-soft: #e8f0fe; --user: #1f6feb; --user-text: #ffffff;
    --notice-bg: #fff8e6; --notice-border: #f0c36d; --notice-text: #7a5300;
    --refuse-bg: #f3f4f6; --error-bg: #fdecec; --error-text: #b42318; --card: #fafbfc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --panel: #181c21; --side: #14181d; --border: #2b3139; --text: #e6e9ed; --muted: #95a0ad;
      --accent: #4c8dff; --accent-soft: #1d2a40; --user: #2f6fe0; --user-text: #ffffff;
      --notice-bg: #2a2413; --notice-border: #7a5f1f; --notice-text: #f0cf7a;
      --refuse-bg: #20252b; --error-bg: #3a1d1d; --error-text: #ff9b91; --card: #1c2127;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
         color: var(--text); background: var(--bg); height: 100vh; display: flex; }
  button { font: inherit; cursor: pointer; }
  #sidebar { width: 260px; flex-shrink: 0; background: var(--side); border-right: 1px solid var(--border);
             display: flex; flex-direction: column; }
  #sidebar h1 { font-size: 17px; margin: 18px 16px 4px; }
  #sidebar .sub { font-size: 12px; color: var(--muted); margin: 0 16px 12px; }
  #newChat { margin: 0 12px 12px; padding: 9px; border: 1px solid var(--border); border-radius: 8px;
             background: var(--panel); color: var(--text); }
  #newChat:hover { border-color: var(--accent); }
  #sessionList { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
  .session { padding: 8px 10px; border-radius: 6px; cursor: pointer; margin-bottom: 2px; }
  .session:hover { background: var(--panel); }
  .session.active { background: var(--accent-soft); }
  .session .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
  .session .d { font-size: 12px; color: var(--muted); }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #topbar { display: none; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--panel); }
  #banner { display: none; margin: 12px auto 0; max-width: 820px; width: calc(100% - 32px); padding: 8px 12px;
            border-radius: 8px; background: var(--error-bg); color: var(--error-text); font-size: 14px; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; }
  .wrap { max-width: 820px; margin: 0 auto; }
  .empty { text-align: center; color: var(--muted); margin-top: 12vh; }
  .empty h2 { color: var(--text); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
  .chip { padding: 7px 12px; border: 1px solid var(--border); border-radius: 16px; background: var(--panel);
          color: var(--text); font-size: 14px; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .msg { margin: 14px 0; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 88%; padding: 10px 14px; border-radius: 12px; word-break: break-word; }
  .user .bubble { background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .assistant .bubble { background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; width: 88%; }
  .assistant.kind-refuse .bubble, .assistant.kind-decline_advice .bubble, .assistant.kind-realtime_notice .bubble { background: var(--refuse-bg); }
  .badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px; margin-bottom: 6px;
           background: var(--accent-soft); color: var(--accent); }
  .body p { margin: 0 0 8px; }
  .body ul, .body ol { margin: 0 0 8px; padding-left: 22px; }
  .body .h { font-weight: 600; margin: 6px 0; }
  .notice { margin: 8px 0 4px; padding: 8px 10px; border-left: 3px solid var(--notice-border);
            background: var(--notice-bg); color: var(--notice-text); font-size: 13px; border-radius: 4px; }
  sup.cite { color: var(--accent); cursor: pointer; font-size: 11px; margin-left: 1px; }
  .sources { margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 8px; }
  .sources .label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .card { font-size: 13px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); margin-bottom: 6px; }
  .card.flash { border-color: var(--accent); }
  .card .meta { color: var(--muted); }
  .card a { color: var(--accent); text-decoration: none; }
  .actions { margin-top: 6px; display: flex; gap: 8px; }
  .actions button { border: none; background: none; color: var(--muted); font-size: 13px; padding: 2px 0; }
  .actions button:hover { color: var(--accent); }
  .err { color: var(--error-text); background: var(--error-bg); padding: 8px 10px; border-radius: 6px; font-size: 14px; }
  .cursor::after { content: "▍"; animation: blink 1s steps(1) infinite; color: var(--muted); }
  @keyframes blink { 50% { opacity: 0; } }
  #composer { border-top: 1px solid var(--border); background: var(--panel); padding: 12px 16px; }
  #composer .wrap { display: flex; gap: 8px; align-items: flex-end; }
  #input { flex: 1; resize: none; min-height: 44px; max-height: 160px; padding: 10px 12px; border: 1px solid var(--border);
           border-radius: 10px; font: inherit; color: var(--text); background: var(--bg); }
  #input:focus { outline: none; border-color: var(--accent); }
  #send { padding: 10px 18px; border: none; border-radius: 10px; background: var(--accent); color: #fff; }
  #send:disabled { opacity: .5; cursor: not-allowed; }
  .hint { max-width: 820px; margin: 6px auto 0; font-size: 12px; color: var(--muted); }
  @media (max-width: 760px) {
    #sidebar { position: fixed; z-index: 10; left: 0; top: 0; bottom: 0; transform: translateX(-100%); transition: transform .2s; }
    #sidebar.open { transform: none; }
    #topbar { display: flex; }
    .bubble, .assistant .bubble { max-width: 100%; width: 100%; }
  }
</style>
</head>
<body>
<aside id="sidebar">
  <h1>FinKB 金融知识库</h1>
  <div class="sub">金融资料查询与解读，不提供投资建议</div>
  <button id="newChat">＋ 新对话</button>
  <div id="sessionList"></div>
</aside>
<main id="main">
  <div id="topbar"><button id="menu" class="chip">☰ 历史</button><strong>FinKB</strong></div>
  <div id="banner"></div>
  <div id="messages"><div class="wrap" id="thread"></div></div>
  <div id="composer">
    <div class="wrap">
      <textarea id="input" rows="1" placeholder="输入问题，Enter 发送，Shift+Enter 换行" maxlength="500"></textarea>
      <button id="send">发送</button>
    </div>
    <div class="hint">回答仅基于知识库资料，可能存在滞后；金融产品存在风险，正式信息以产品合同、公告原文和监管文件为准。</div>
  </div>
</main>
<script>
const EXAMPLES = ["茅台今年一季度营业收入是多少？", "华夏债券C的托管费是多少？", "什么是ETF？",
                  "基金赎回多久到账？", "这份货币政策执行报告主要讲了什么？", "现在该买茅台吗？"];
const KIND_BADGE = { refuse: "资料不足", clarify: "需要确认", decline_advice: "不提供投资建议", realtime_notice: "非实时数据" };
const $ = (id) => document.getElementById(id);
let sessionId = null;
let busy = false;

function esc(s) { return s.replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c])); }

// 简易 Markdown：粗体、列表、标题、段落；[E1] 引用编号转为可点击的上标；风险/时效提示单独成框
function inline(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
               .replace(/\[E(\d+)\]/g, '<sup class="cite" data-eid="$1">[$1]</sup>');
}
function renderMarkdown(text) {
  const out = []; let list = null;
  const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const raw of text.split("\n")) {
    const line = raw.trim();
    if (!line) { closeList(); continue; }
    if (/^(风险提示|时效提示)：/.test(line)) { closeList(); out.push(`<div class="notice">${inline(line)}</div>`); continue; }
    let m;
    if ((m = line.match(/^[-*•]\s+(.*)$/))) { if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; } out.push(`<li>${inline(m[1])}</li>`); continue; }
    if ((m = line.match(/^\d+[.、]\s*(.*)$/))) { if (list !== "ol") { closeList(); out.push("<ol>"); list = "ol"; } out.push(`<li>${inline(m[1])}</li>`); continue; }
    closeList();
    if ((m = line.match(/^#{1,6}\s+(.*)$/))) { out.push(`<div class="h">${inline(m[1])}</div>`); continue; }
    out.push(`<p>${inline(line)}</p>`);
  }
  closeList();
  return out.join("");
}

function sourceCard(s) {
  const pages = s.page_start ? (s.page_start === s.page_end ? `第${s.page_start}页` : `第${s.page_start}-${s.page_end}页`) : "";
  const entity = s.entity_name ? `${esc(s.entity_name)}${s.entity_codes && s.entity_codes.length ? "（" + esc(s.entity_codes.join("、")) + "）" : ""}` : "";
  const link = s.source_path ? `<a href="${esc(s.source_path)}${s.page_start ? "#page=" + s.page_start : ""}" target="_blank" rel="noopener">打开原件</a>` : "";
  const meta = [esc(s.content_type || ""), entity, esc(s.file_name || ""), pages].filter(Boolean).join(" ｜ ");
  return `<div class="card" data-eid="${s.eid}"><strong>[E${s.eid}] ${esc(s.document_title || s.file_name || "")}</strong>
          <div class="meta">${meta}${s.derived ? " ｜ 据图表示意" : ""} ${link}</div></div>`;
}

function localTime(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function scrollBottom() { const m = $("messages"); m.scrollTop = m.scrollHeight; }
function banner(text) { const b = $("banner"); b.textContent = text || ""; b.style.display = text ? "block" : "none"; }

function addUser(text) {
  const div = document.createElement("div");
  div.className = "msg user";
  div.innerHTML = `<div class="bubble">${esc(text)}</div>`;
  $("thread").appendChild(div); scrollBottom();
}

function addAssistant(question) {
  const div = document.createElement("div");
  div.className = "msg assistant";
  div.innerHTML = `<div class="bubble"><div class="head"></div><div class="body cursor"></div><div class="sources" hidden></div>
                   <div class="actions"><button class="retry">↻ 重新提问</button></div></div>`;
  div.querySelector(".retry").onclick = () => ask(question);
  div.addEventListener("click", (e) => {
    const eid = e.target.dataset && e.target.dataset.eid;
    if (!e.target.classList.contains("cite") || !eid) return;
    const card = div.querySelector(`.card[data-eid="${eid}"]`);
    if (card) { card.classList.add("flash"); card.scrollIntoView({block: "nearest"}); setTimeout(() => card.classList.remove("flash"), 1500); }
  });
  $("thread").appendChild(div); scrollBottom();
  return div;
}

function fillAssistant(div, {text, kind, sources, streaming}) {
  const body = div.querySelector(".body");
  body.innerHTML = renderMarkdown(text || "");
  body.classList.toggle("cursor", !!streaming);
  if (kind) {
    div.classList.add("kind-" + kind);
    div.querySelector(".head").innerHTML = KIND_BADGE[kind] ? `<span class="badge">${KIND_BADGE[kind]}</span>` : "";
  }
  const box = div.querySelector(".sources");
  if (sources && sources.length) {
    box.hidden = false;
    box.innerHTML = `<div class="label">引用来源</div>` + sources.map(sourceCard).join("");
  }
}

function showError(div, message, question) {
  const body = div.querySelector(".body");
  body.classList.remove("cursor");
  const err = document.createElement("div");
  err.className = "err";
  err.textContent = message;
  body.appendChild(err);
  div.querySelector(".retry").textContent = "↻ 重试";
  div.querySelector(".retry").onclick = () => ask(question);
}

function parseSSE(raw) {
  let event = "message", data = "";
  for (const line of raw.split("\n")) {
    if (line.startsWith("event:")) event = line.slice(6).trim();
    else if (line.startsWith("data:")) data += line.slice(5).trim();
  }
  try { return {event, data: JSON.parse(data || "{}")}; } catch { return {event, data: {}}; }
}

async function ask(question) {
  question = (question || "").trim();
  if (!question || busy) return;
  busy = true; $("send").disabled = true; banner("");
  const empty = document.querySelector(".empty"); if (empty) empty.remove();
  addUser(question);
  const div = addAssistant(question);
  let text = "", sources = [], gotFinal = false;
  try {
    const resp = await fetch("/query", {method: "POST", headers: {"Content-Type": "application/json"},
                                        body: JSON.stringify({question, session_id: sessionId})});
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(typeof err.detail === "string" ? err.detail : `请求失败（HTTP ${resp.status}）`);
    }
    const reader = resp.body.getReader(); const decoder = new TextDecoder(); let buf = "";
    while (true) {
      const {value, done} = await reader.read();
      if (done) break;
      buf += decoder.decode(value, {stream: true}).replace(/\r\n/g, "\n");
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const {event, data} = parseSSE(buf.slice(0, idx)); buf = buf.slice(idx + 2);
        if (event === "delta") { text += data.text || ""; fillAssistant(div, {text, streaming: true}); scrollBottom(); }
        else if (event === "sources") { sources = data.sources || []; }
        else if (event === "final") {
          gotFinal = true; sessionId = data.session_id;
          fillAssistant(div, {text: data.answer || text, kind: data.kind, sources: data.sources || sources});
          loadSessions();
        } else if (event === "error") {
          gotFinal = true; if (data.session_id) sessionId = data.session_id;
          fillAssistant(div, {text}); showError(div, data.message || "服务处理出错，请稍后重试。", question);
        }
      }
    }
    if (!gotFinal) { fillAssistant(div, {text}); showError(div, "连接中断，回答可能不完整，请重试。", question); }
  } catch (e) {
    fillAssistant(div, {text});
    showError(div, e instanceof TypeError ? "无法连接服务，请确认查询服务已启动后重试。" : e.message, question);
  } finally {
    busy = false; $("send").disabled = false; scrollBottom();
  }
}

function showEmpty() {
  $("thread").innerHTML = `<div class="empty"><h2>有什么可以帮您？</h2>
    <div>可以询问金融产品、公司公告、宏观政策、金融知识和业务流程</div>
    <div class="chips">${EXAMPLES.map(q => `<button class="chip">${esc(q)}</button>`).join("")}</div></div>`;
  document.querySelectorAll(".empty .chip").forEach(b => b.onclick = () => ask(b.textContent));
}

function newChat() { sessionId = null; showEmpty(); highlightSession(); $("input").focus(); }

function highlightSession() {
  document.querySelectorAll(".session").forEach(el => el.classList.toggle("active", el.dataset.id === sessionId));
}

async function loadSessions() {
  try {
    const resp = await fetch("/sessions");
    if (!resp.ok) throw new Error();
    const {sessions} = await resp.json();
    $("sessionList").innerHTML = sessions.map(s => `<div class="session" data-id="${esc(s.session_id)}">
        <div class="t">${esc(s.title || "（无标题）")}</div><div class="d">${esc(localTime(s.updated_at))}</div></div>`).join("")
        || `<div class="sub">暂无历史会话</div>`;
    document.querySelectorAll(".session").forEach(el => el.onclick = () => openSession(el.dataset.id));
    highlightSession();
  } catch { banner("历史会话加载失败：无法连接查询服务。"); }
}

async function openSession(id) {
  if (busy) return;
  try {
    const resp = await fetch(`/sessions/${encodeURIComponent(id)}/messages`);
    if (!resp.ok) throw new Error();
    const {messages} = await resp.json();
    sessionId = id; $("thread").innerHTML = ""; banner("");
    let lastQuestion = "";
    for (const m of messages) {
      if (m.role === "user") { lastQuestion = m.text; addUser(m.text); }
      else fillAssistant(addAssistant(lastQuestion), {text: m.text, kind: m.kind, sources: m.sources});
    }
    highlightSession(); $("sidebar").classList.remove("open");
  } catch { banner("会话记录加载失败，请稍后重试。"); }
}

$("send").onclick = () => {
  if (busy || !$("input").value.trim()) return;  // 上一条回答未结束时保留输入内容
  const q = $("input").value; $("input").value = ""; ask(q);
};
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("send").click(); }
});
$("newChat").onclick = newChat;
$("menu").onclick = () => $("sidebar").classList.toggle("open");
showEmpty();
loadSessions();
</script>
</body>
</html>
