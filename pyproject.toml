[project]
name = "finkb"
version = "0.1.0"
description = "金融知识库 RAG：导入流水线、查询规划、合规回答"
requires-python = "==3.12.*"
dependencies = [
    "flagembedding>=1.3.5",
    "langgraph>=0.4",
    "minio>=7.2.20",
    "openai>=1.60",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    # 服务端为 Milvus v2.5.5；2.6.x 客户端已在旧项目实测兼容，3.x 未验证
    "pymilvus>=2.6.10,<2.7",
    "pymongo>=4.10",
    "requests>=2.32",
    "torch>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
# 与旧项目一致：不打包，在项目根目录下按 common / utils / processor 直接导入
package = false
# 只解析 Windows x64；torch 用 PyPI 默认的 CPU 版，不加 CUDA 索引
required-environments = "sys_platform == 'win32' and platform_machine == 'AMD64'"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: 需要中间件或外部 API，默认跳过，用 -m integration 运行",
]
addopts = "-m 'not integration'"
